---
- name: List credentials in project
  ansible.builtin.uri:
    url: "{{ orchestrator_host }}/api/v1/projects/{{ credential_project_id }}/credentials"
    method: GET
    headers:
      Authorization: "Bearer {{ orchestrator_token }}"
    status_code: 200
    validate_certs: "{{ orchestrator_validate_certs }}"
  register: project_credentials

- name: Find credential by name
  ansible.builtin.set_fact:
    matching_credentials: "{{ project_credentials.json.resources | selectattr('name', 'equalto', credential_name) | list }}"

- name: Credential does not exist
  ansible.builtin.debug:
    msg: "Credential '{{ credential_name }}' not found in project '{{ credential_project_name }}', nothing to delete"
  when: matching_credentials | length == 0

- name: Delete the credential
  ansible.builtin.uri:
    url: "{{ orchestrator_host }}/api/v1/projects/{{ credential_project_id }}/credentials/{{ matching_credentials[0].id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ orchestrator_token }}"
    status_code: 204
    validate_certs: "{{ orchestrator_validate_certs }}"
  when: matching_credentials | length > 0
