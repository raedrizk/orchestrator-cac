---
- name: Look up credential type by name
  ansible.builtin.uri:
    url: "{{ orchestrator_host }}/api/v1/credential_types"
    method: GET
    headers:
      Authorization: "Bearer {{ orchestrator_token }}"
    status_code: 200
    validate_certs: "{{ orchestrator_validate_certs }}"
  register: credential_types

- name: Find matching credential type
  ansible.builtin.set_fact:
    credential_type_id: "{{ credential_types.json.resources | selectattr('name', 'equalto', credential_type_name) | map(attribute='id') | first }}"

- name: Check if credential already exists in project
  ansible.builtin.uri:
    url: "{{ orchestrator_host }}/api/v1/projects/{{ credential_project_id }}/credentials"
    method: GET
    headers:
      Authorization: "Bearer {{ orchestrator_token }}"
    status_code: 200
    validate_certs: "{{ orchestrator_validate_certs }}"
  register: existing_credentials

- name: Credential already exists
  ansible.builtin.debug:
    msg: "Credential '{{ credential_name }}' already exists in project '{{ credential_project_name }}'"
  when: existing_credentials.json.resources | selectattr('name', 'equalto', credential_name) | list | length > 0

- name: Create the credential
  ansible.builtin.uri:
    url: "{{ orchestrator_host }}/api/v1/projects/{{ credential_project_id }}/credentials"
    method: POST
    body_format: json
    body:
      name: "{{ credential_name }}"
      description: "{{ credential_description | default(omit) }}"
      credential_type_id: "{{ credential_type_id }}"
      inputs: "{{ credential_inputs }}"
      labels: "{{ credential_labels }}"
    headers:
      Authorization: "Bearer {{ orchestrator_token }}"
      Content-Type: "application/json"
    status_code: 201
    validate_certs: "{{ orchestrator_validate_certs }}"
  register: create_credential_response
  when: existing_credentials.json.resources | selectattr('name', 'equalto', credential_name) | list | length == 0
